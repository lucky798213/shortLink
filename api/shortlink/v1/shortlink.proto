syntax = "proto3";

package shortlink.v1;

option go_package = "short_url/api/shortlink/v1;shortlinkv1";

enum ShortLinkStatus {
  SHORT_LINK_STATUS_UNSPECIFIED = 0;
  SHORT_LINK_STATUS_ACTIVE = 1;
  SHORT_LINK_STATUS_EXPIRED = 2;
  SHORT_LINK_STATUS_NOT_FOUND = 3;
}

service ShortLinkService {
  rpc CreateShortUrl(CreateShortUrlRequest) returns (CreateShortUrlResponse);
  rpc GetOriginUrl(GetOriginUrlRequest) returns (GetOriginUrlResponse);
  rpc GetShortUrl(GetShortUrlRequest) returns (GetShortUrlResponse);
  rpc DeleteShortUrl(DeleteShortUrlRequest) returns (DeleteShortUrlResponse);
  rpc GetShortUrlStats(GetShortUrlStatsRequest) returns (GetShortUrlStatsResponse);
}

message CreateShortUrlRequest {
  string origin_url = 1;
  int64 expire_at = 2;
}

message CreateShortUrlResponse {
  string short_code = 1;
}

message GetOriginUrlRequest {
  string short_code = 1;
  string client_ip = 2;
  string user_agent = 3;
  string referer = 4;
}

message GetOriginUrlResponse {
  string origin_url = 1;
  int64 created_at = 2;
  int64 expire_at = 3;
  ShortLinkStatus status = 4;
}

message GetShortUrlRequest {
  string short_code = 1;
}

message GetShortUrlResponse {
  string short_code = 1;
  string origin_url = 2;
  int64 created_at = 3;
  int64 expire_at = 4;
  ShortLinkStatus status = 5;
}

message DeleteShortUrlRequest {
  string short_code = 1;
}

message DeleteShortUrlResponse {
  bool deleted = 1;
}

message StatsItem {
  string value = 1;
  int64 count = 2;
}

message GetShortUrlStatsRequest {
  string short_code = 1;
}

message GetShortUrlStatsResponse {
  string short_code = 1;
  int64 pv = 2;
  int64 uv = 3;
  int64 last_visited_at = 4;
  repeated StatsItem top_referers = 5;
  repeated StatsItem top_user_agents = 6;
  ShortLinkStatus status = 7;
}
