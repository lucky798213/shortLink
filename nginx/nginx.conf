events {
    worker_connections 1024;
}

http {
    upstream short_url_web {
        server web:8080;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=short_url_ip:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            proxy_pass http://short_url_web/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /readyz {
            proxy_pass http://short_url_web/readyz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=short_url_ip burst=200 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://short_url_web;
        }
    }
}
